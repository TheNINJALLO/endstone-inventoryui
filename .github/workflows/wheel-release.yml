name: Build wheel and publish release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: tests/live/client/go.sum
      - name: Build pinned acceptance client
        working-directory: tests/live/client
        run: |
          go build -o bedrock-inventory-client .
          GOOS=windows GOARCH=amd64 go build -o bedrock-inventory-client.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-client
          path: tests/live/client/bedrock-inventory-client*
  build-wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade build pytest
          python -m build --wheel

      - name: Test built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pytest -q

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Publish wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
