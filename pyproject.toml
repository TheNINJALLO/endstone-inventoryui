[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-inventoryui"
version = "2.0.10"
dependencies = [
    "endstone>=0.11.15,<0.12",
    "bstream>=1.0.1,<2",
    "rapidnbt>=1.3.1,<2"
]
authors = [
    { name = "Shock95", email = "" },
]
description = "Inventory UI plugin for Endstone servers"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "plugin"]

[project.urls]
Homepage = "https://github.com/TheNINJALLO/endstone-inventoryui"

[project.entry-points."endstone"]
inventoryui = "endstone_inventoryui:InventoryUIPlugin"
